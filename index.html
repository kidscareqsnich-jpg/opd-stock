<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#cfe3ff">
<title>พัสดุ OPD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root {
    --sky:#e8f2ff; --sky2:#cfe3ff; --blue:#6ea8f0; --blue-d:#3f7fd6;
    --blush:#ffeef4; --pink:#ffc7da; --pink-d:#e8799f;
    --ink:#3b4660; --muted:#8a94ad; --line:#e6ebf5; --card:#ffffff;
    --ok:#3dbb8a; --ok-bg:#e3f7ee; --bad:#e2637d; --bad-bg:#ffe8ed;
    --open:#e3f7ee; --open-t:#2b9a70; --ask:#fff1df; --ask-t:#c27a22; --life:#ffe3ea; --life-t:#d0496b;
    --r:20px; --shadow:0 6px 20px rgba(110,140,200,.14);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; }
  body {
    font:16px/1.5 "Prompt", system-ui, sans-serif; color:var(--ink);
    background:linear-gradient(180deg, var(--sky) 0%, #f6f9ff 40%, var(--blush) 100%) fixed;
    min-height:100vh;
  }
  .brand { font-family:"Mali", "Prompt", sans-serif; }
  button, input, select { font:inherit; color:inherit; }

  /* ---------- top bar ---------- */
  header {
    position:sticky; top:0; z-index:5; padding:14px 16px 12px;
    background:linear-gradient(120deg, rgba(207,227,255,.92), rgba(255,215,229,.92));
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(255,255,255,.7);
  }
  .top { max-width:560px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .hello { font-size:13px; color:var(--muted); line-height:1.2; }
  .hello b { display:block; font-family:"Mali", sans-serif; font-size:19px; color:var(--ink); }
  .clinic-chip {
    border:none; background:#fff; border-radius:999px; padding:8px 12px 8px 10px;
    display:flex; align-items:center; gap:6px; font-size:13px; font-weight:500; box-shadow:var(--shadow);
    max-width:56%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .clinic-chip .dot { width:10px; height:10px; border-radius:50%; background:var(--pink-d); flex:none; }
  .clinic-chip.after .dot { background:var(--blue-d); }

  main { max-width:560px; margin:0 auto; padding:16px 16px 96px; }
  h2 { font-family:"Mali", sans-serif; font-size:22px; margin:6px 0 10px; }
  h3 { font-family:"Mali", sans-serif; font-size:17px; margin:20px 0 8px; }
  .muted { color:var(--muted); } .sm { font-size:13px; }
  .card { background:var(--card); border-radius:var(--r); padding:18px; box-shadow:var(--shadow); margin-bottom:14px; }

  /* ---------- home ---------- */
  .scan-hero {
    width:100%; border:none; border-radius:26px; padding:22px 20px; text-align:left; cursor:pointer;
    background:linear-gradient(135deg, #8ebcf7 0%, #b9a8f2 55%, #f7a8c6 100%); color:#fff;
    box-shadow:0 12px 28px rgba(140,140,230,.35); display:flex; align-items:center; gap:16px;
  }
  .scan-hero .ico { width:60px; height:60px; border-radius:18px; background:rgba(255,255,255,.25); display:grid; place-items:center; flex:none; }
  .scan-hero b { font-family:"Mali", sans-serif; font-size:22px; display:block; }
  .scan-hero span { font-size:13px; opacity:.92; }
  .tiles { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin:14px 0 18px; }
  .tile {
    border:none; background:#fff; border-radius:18px; padding:14px 6px 12px; box-shadow:var(--shadow);
    display:flex; flex-direction:column; align-items:center; gap:6px; font-size:13px; font-weight:500; position:relative;
  }
  .tile .ti { width:42px; height:42px; border-radius:14px; display:grid; place-items:center; font-size:22px; }
  .tile .badge-n { position:absolute; top:8px; right:10px; background:var(--pink-d); color:#fff; border-radius:999px; font-size:11px; min-width:20px; padding:1px 6px; }
  .search { position:relative; }
  .search input { width:100%; border:none; background:#fff; border-radius:16px; padding:13px 14px 13px 42px; box-shadow:var(--shadow); outline:none; }
  .search svg { position:absolute; left:14px; top:50%; transform:translateY(-50%); }
  .chips { display:flex; gap:8px; overflow-x:auto; padding:12px 2px 6px; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { border:none; white-space:nowrap; border-radius:999px; padding:7px 14px; font-size:13px; background:rgba(255,255,255,.7); color:var(--muted); }
  .chip.on { background:var(--blue); color:#fff; }
  .list { display:grid; gap:10px; margin-top:6px; }
  .item {
    width:100%; border:none; background:#fff; border-radius:18px; padding:12px 14px; text-align:left;
    display:flex; align-items:center; gap:12px; box-shadow:0 3px 12px rgba(110,140,200,.10);
  }
  .item .em { width:40px; height:40px; border-radius:13px; display:grid; place-items:center; font-size:20px; flex:none; }
  .item .nm { font-weight:500; font-size:15px; line-height:1.3; }
  .item .meta { font-size:12px; color:var(--muted); }
  .item .q { margin-left:auto; text-align:right; flex:none; }
  .item .q b { display:block; font-size:16px; }
  .tag { display:inline-block; font-size:11px; padding:2px 9px; border-radius:999px; font-weight:500; }
  .t-open { background:var(--open); color:var(--open-t); }
  .t-ask { background:var(--ask); color:var(--ask-t); }
  .t-life { background:var(--life); color:var(--life-t); }

  /* ---------- item page ---------- */
  .back { border:none; background:rgba(255,255,255,.75); border-radius:999px; padding:8px 14px; font-size:14px; margin-bottom:12px; }
  .hero-item { text-align:center; padding:24px 18px; }
  .hero-item .em-big { width:76px; height:76px; margin:0 auto 10px; border-radius:24px; display:grid; place-items:center; font-size:38px; }
  .hero-item .code { font-size:12px; color:var(--muted); }
  .stock { margin:14px auto 4px; display:inline-flex; align-items:baseline; gap:6px; background:var(--sky); border-radius:16px; padding:8px 18px; }
  .stock b { font-size:28px; font-family:"Mali", sans-serif; color:var(--blue-d); }
  .stepper { display:flex; align-items:center; justify-content:center; gap:14px; margin:18px 0 6px; }
  .stepper button { width:56px; height:56px; border-radius:50%; border:none; font-size:28px; background:var(--sky); color:var(--blue-d); }
  .stepper button.plus { background:var(--blush); color:var(--pink-d); }
  .stepper input { width:96px; text-align:center; font-size:30px; font-family:"Mali", sans-serif; border:none; background:transparent; outline:none; }
  .unit { text-align:center; color:var(--muted); font-size:13px; }
  .field { width:100%; border:1.5px solid var(--line); background:#fff; border-radius:14px; padding:12px 14px; margin:8px 0; outline:none; }
  .field:focus { border-color:var(--blue); }
  label.lb { display:block; font-size:13px; color:var(--muted); margin-top:10px; }
  .btn { width:100%; border:none; border-radius:16px; padding:15px; font-size:16px; font-weight:600; cursor:pointer; }
  .btn:disabled { opacity:.55; }
  .btn-main { background:linear-gradient(120deg, var(--blue) 0%, #a59cf0 60%, var(--pink-d) 100%); color:#fff; box-shadow:0 8px 20px rgba(130,130,230,.3); }
  .btn-soft { background:var(--sky); color:var(--blue-d); }
  .btn-pink { background:var(--blush); color:var(--pink-d); }
  .btn-ok { background:var(--ok); color:#fff; }
  .btn-line { background:#fff; color:var(--bad); border:1.5px solid var(--bad-bg); }
  .stack { display:grid; gap:10px; margin-top:16px; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .note { background:var(--ask); color:var(--ask-t); border-radius:14px; padding:10px 12px; font-size:13px; margin-top:12px; }
  .note.life { background:var(--life); color:var(--life-t); }
  .check { display:flex; align-items:center; gap:10px; margin:12px 0; font-size:15px; }
  .check input { width:20px; height:20px; accent-color:var(--pink-d); }

  /* ---------- sheet / modal ---------- */
  .overlay { position:fixed; inset:0; background:rgba(60,70,100,.35); z-index:20; display:flex; align-items:flex-end; justify-content:center; animation:fade .2s; }
  .sheet { width:100%; max-width:560px; background:#fff; border-radius:28px 28px 0 0; padding:22px 18px calc(22px + env(safe-area-inset-bottom)); animation:up .25s ease-out; }
  .sheet .grab { width:44px; height:5px; border-radius:99px; background:var(--line); margin:-8px auto 14px; }
  .opt { width:100%; border:2px solid var(--line); background:#fff; border-radius:18px; padding:16px; display:flex; align-items:center; gap:14px; text-align:left; margin-bottom:10px; }
  .opt.on { border-color:var(--pink-d); background:var(--blush); }
  .opt .oi { width:46px; height:46px; border-radius:15px; display:grid; place-items:center; font-size:24px; flex:none; }
  .opt b { display:block; font-size:16px; }
  .success { text-align:center; }
  .success .big-ok { width:84px; height:84px; border-radius:50%; margin:4px auto 12px; background:var(--ok-bg); display:grid; place-items:center; animation:pop .35s ease-out; }
  @keyframes fade { from { opacity:0; } }
  @keyframes up { from { transform:translateY(40px); opacity:.4; } }
  @keyframes pop { 0% { transform:scale(.5); } 70% { transform:scale(1.1); } }

  /* ---------- count ---------- */
  .crow { background:#fff; border-radius:16px; padding:10px 12px; display:grid; grid-template-columns:1fr 84px 64px; gap:8px; align-items:center; box-shadow:0 3px 12px rgba(110,140,200,.10); }
  .crow.done { background:var(--ok-bg); }
  .crow input { width:100%; border:1.5px solid var(--line); border-radius:12px; padding:9px; text-align:center; outline:none; }
  .crow .btn { padding:10px 0; font-size:14px; border-radius:12px; }
  .progress { height:10px; background:var(--sky); border-radius:99px; overflow:hidden; margin:8px 0 4px; }
  .progress i { display:block; height:100%; background:linear-gradient(90deg, var(--blue), var(--pink-d)); border-radius:99px; transition:width .3s; }

  /* ---------- toast ---------- */
  #toast { position:fixed; left:16px; right:16px; top:calc(12px + env(safe-area-inset-top)); z-index:30; margin:0 auto; max-width:520px;
    background:var(--ink); color:#fff; padding:13px 16px; border-radius:16px; text-align:center; font-size:14px;
    box-shadow:0 10px 24px rgba(40,50,80,.25); opacity:0; transform:translateY(-16px); transition:.2s; pointer-events:none; }
  #toast.show { opacity:1; transform:none; } #toast.bad { background:var(--bad); }
  .loading { text-align:center; padding:60px 0; color:var(--muted); }
  .tiles.four { grid-template-columns:repeat(4, 1fr); gap:8px; }
  .tiles.four .tile { font-size:13px; padding-left:4px; padding-right:4px; }
  .stats { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin:10px 0 4px; }
  .stat { background:#fff; border-radius:16px; padding:12px 8px; text-align:center; box-shadow:0 3px 12px rgba(110,140,200,.10); }
  .stat b { display:block; font-family:"Mali", sans-serif; font-size:20px; color:var(--blue-d); }
  .stat span { font-size:12px; color:var(--muted); }
  .srow { background:#fff; border-radius:16px; padding:12px 14px; display:flex; gap:10px; align-items:center; box-shadow:0 3px 12px rgba(110,140,200,.10); }
  .srow .nm { font-weight:500; font-size:14px; line-height:1.3; }
  .srow .r { margin-left:auto; text-align:right; flex:none; }
  .srow .r b { display:block; font-size:16px; }
  .up { color:var(--bad); } .down { color:var(--ok); }
  .tiles.five { grid-template-columns:repeat(5, 1fr); gap:6px; }
  .tiles.five .tile { font-size:12px; padding-left:2px; padding-right:2px; }
  .tiles.five .tile .ti { width:38px; height:38px; font-size:20px; }
  #cartbar { position:fixed; left:16px; right:16px; bottom:calc(14px + env(safe-area-inset-bottom)); z-index:15; max-width:520px; margin:0 auto;
    border:none; border-radius:20px; padding:14px 18px; display:flex; align-items:center; gap:10px; color:#fff; font-family:inherit; font-size:15px;
    background:linear-gradient(120deg, var(--blue), var(--pink-d)); box-shadow:0 10px 26px rgba(120,120,200,.35); }
  #cartbar b { font-size:16px; } #cartbar .n { background:#fff; color:var(--pink-d); border-radius:999px; min-width:26px; padding:2px 8px; font-weight:700; }
  body.has-cart main { padding-bottom:90px; }
  .cline { background:#fff; border-radius:16px; padding:12px; display:flex; gap:10px; align-items:center; box-shadow:0 3px 12px rgba(110,140,200,.10); }
  .cline .nm { font-weight:500; font-size:14px; line-height:1.3; }
  .mini-step { display:flex; align-items:center; gap:4px; flex:none; }
  .mini-step button { width:32px; height:32px; border-radius:50%; border:none; background:var(--sky); color:var(--blue-d); font-size:18px; }
  .mini-step input { width:46px; text-align:center; border:1.5px solid var(--line); border-radius:10px; padding:6px 2px; font-size:15px; }
  .xbtn { border:none; background:var(--bad-bg); color:var(--bad); width:32px; height:32px; border-radius:50%; font-size:15px; flex:none; }
  .hday { font-size:13px; color:var(--muted); margin:16px 2px 6px; font-weight:500; }
  .loading .blob { width:54px; height:54px; margin:0 auto 12px; border-radius:50%; background:linear-gradient(135deg, var(--sky2), var(--pink)); animation:pulse 1.2s infinite ease-in-out; }
  @keyframes pulse { 50% { transform:scale(.8); opacity:.6; } }
</style>
</head>
<body>
<header><div class="top">
  <div class="hello" id="hello"><span>พัสดุ OPD</span><b class="brand">สวัสดีค่ะ 🌸</b></div>
  <button class="clinic-chip" id="clinicChip" hidden></button>
</div></header>
<main id="app"><div class="loading"><div class="blob"></div>กำลังเปิดระบบ...</div></main>
<div id="toast"></div>

<script>
const CONFIG = {
  LIFF_ID: '2012074647-BmAlHwZ3',
  API_URL: 'https://script.google.com/macros/s/AKfycbx8jDwnC2srH8r_7BqTh7m4cZM_3WWhI8HZGr-MtkNrV5VHNsVc09mksqlhnok9VpOq/exec'
};

const S = { me: null, items: [], pending: 0, staff: [], units: [], clinics: [], clinic: '', cat: 'ทั้งหมด', idToken: '' };
const $app = document.getElementById('app');
const KEY_CLINIC = 'opd-clinic';
const KEY_PARTNER = 'opd-count-partner';
const KEY_BASE = 'opd-base';
const KEY_CART = 'opd-cart';

// ---------- ตัวช่วย ----------
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === false || v == null) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  kids.flat().forEach(c => { if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(String(c))); });
  return el;
}
function render(...nodes) { S.view = ''; $app.replaceChildren(...nodes.flat(Infinity).filter(Boolean)); window.scrollTo(0, 0); drawCartBar(); }
function loading(msg) { render(h('div', { class: 'loading' }, h('div', { class: 'blob' }), msg || 'กำลังโหลด...')); }
function toast(msg, bad, ms) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'show' + (bad ? ' bad' : '');
  clearTimeout(toast.t); toast.t = setTimeout(() => { t.className = ''; }, ms || 2600);
}
function fmtN(n) { return Number(n).toLocaleString('th-TH', { maximumFractionDigits: 2 }); }
function isKeeper() { return S.me && S.me.keeper; }
function store(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (_) {} }
function load(k) { try { return localStorage.getItem(k); } catch (_) { return null; } }
function today() { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }

const CAT_EMOJI = { 'วัสดุสำนักงาน': '📎', 'วัสดุงานบ้านงานครัว': '🧴', 'วัสดุการแพทย์': '🩺', 'วัสดุคอมพิวเตอร์': '🖨️', 'วัสดุไฟฟ้าและวิทยุ': '🔦', 'วัสดุเวชภัณฑ์ที่มิใช่ยา': '💉' };
const CAT_BG = { 'วัสดุสำนักงาน': '#e8f2ff', 'วัสดุงานบ้านงานครัว': '#e9f8f1', 'วัสดุการแพทย์': '#ffeef4', 'วัสดุคอมพิวเตอร์': '#efeaff', 'วัสดุไฟฟ้าและวิทยุ': '#fff6df', 'วัสดุเวชภัณฑ์ที่มิใช่ยา': '#ffeef4' };
const CAT_SHORT = { 'วัสดุสำนักงาน': 'สำนักงาน', 'วัสดุงานบ้านงานครัว': 'งานบ้าน', 'วัสดุการแพทย์': 'การแพทย์', 'วัสดุคอมพิวเตอร์': 'คอมพิวเตอร์', 'วัสดุไฟฟ้าและวิทยุ': 'ไฟฟ้า', 'วัสดุเวชภัณฑ์ที่มิใช่ยา': 'เวชภัณฑ์' };
function emo(i) { return h('div', { class: 'em', style: 'background:' + (CAT_BG[i.cat] || '#e8f2ff') }, CAT_EMOJI[i.cat] || '📦'); }
function tag(t) { return h('span', { class: 'tag ' + (t === 'ต้องขอ' ? 't-ask' : t === 'กู้ชีพ' ? 't-life' : 't-open') }, t === 'ต้องขอ' ? '🔒 ต้องขอ' : t === 'กู้ชีพ' ? '🚑 กู้ชีพ' : 'หยิบได้เลย'); }
const ICON_SCAN = '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M7 12h10"/></svg>';
const ICON_SEARCH = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8a94ad" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>';
const ICON_OK = '<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#3dbb8a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';

// ---------- วันหมดอายุ ----------
function expDays(i) {
  if (!i.exp) return null;
  const [y, m, d] = i.exp.split('-').map(Number);
  const t = new Date(); t.setHours(0, 0, 0, 0);
  return Math.round((new Date(y, m - 1, d) - t) / 86400000);
}
function expText(i) {
  const n = expDays(i);
  const [y, m, d] = i.exp.split('-').map(Number);
  const date = new Date(y, m - 1, d).toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: '2-digit' });
  return n < 0 ? 'หมดอายุแล้ว (' + date + ')' : n === 0 ? 'หมดอายุวันนี้' : 'หมดอายุ ' + date + ' · อีก ' + n + ' วัน';
}
function expiringList() {
  return S.items.filter(i => i.exp && !(i.qty != null && i.qty <= 0) && expDays(i) <= S.expWarn).sort((a, b) => expDays(a) - expDays(b));
}
function expTag(i) {
  if (!i.exp) return null;
  const n = expDays(i), bad = n <= S.expWarn;
  return h('span', { class: 'tag', style: 'background:' + (n < 0 ? 'var(--bad)' : bad ? 'var(--bad-bg)' : 'var(--sky)') + ';color:' + (n < 0 ? '#fff' : bad ? 'var(--bad)' : 'var(--blue-d)') }, '⏰ ' + expText(i));
}
function expInput(i) {
  return h('input', { class: 'field', type: 'date', value: i.exp || '' });
}
function showExpiring() {
  const list = expiringList();
  render(back(), h('h2', {}, '⏰ ใกล้หมดอายุ'),
    h('p', { class: 'sm muted' }, 'รายการที่หมดอายุแล้ว หรือจะหมดภายใน ' + S.expWarn + ' วัน หยิบใช้อันนี้ก่อนนะคะ'),
    h('div', { class: 'list' }, list.length ? list.map(i => h('button', { class: 'item', onclick: () => showItem(i.code) }, emo(i),
      h('div', { style: 'min-width:0' }, h('div', { class: 'nm' }, i.name), h('div', { style: 'margin-top:4px' }, expTag(i))),
      h('div', { class: 'q' }, h('b', {}, i.qty == null ? '–' : fmtN(i.qty)), h('span', { class: 'meta' }, i.unit))))

// ---------- หลังบ้าน ----------
async function api(action, data) {
  const res = await fetch(CONFIG.API_URL, { method: 'POST', keepalive: true, body: JSON.stringify(Object.assign({ action, idToken: S.idToken }, data || {})) });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error);
  return j.data;
}
function applyBase(d) {
  if (!d || !Array.isArray(d.items)) return;
  S.me = d.me; S.items = d.items; S.pending = d.pending; S.staff = d.staffNames; S.units = d.units || []; S.clinics = d.clinics || []; S.expWarn = d.expWarn || 30;
  if (S.me && S.sub) store(KEY_BASE, JSON.stringify({ sub: S.sub, d }));
  if (S.me) {
    const first = S.me.name.split(' ')[0];
    document.getElementById('hello').replaceChildren(h('span', {}, 'พัสดุ OPD · ' + S.me.role), h('b', { class: 'brand' }, 'สวัสดี ' + first + ' 🌸'));

function codeFromUrl() { return new URLSearchParams(location.search).get('item'); }
function viewFromUrl() { return new URLSearchParams(location.search).get('view'); }

// ---------- คลินิก (เลือกครั้งเดียวต่อวัน) ----------
function restoreClinic() {
  try {
    const v = JSON.parse(load(KEY_CLINIC) || 'null');
    if (v && v.day === today() && S.clinics.indexOf(v.name) >= 0) S.clinic = v.name;
  } catch (_) {}
}
// หน้าตาของแต่ละคลินิก (ชื่อที่ไม่อยู่ในรายการนี้ใช้แบบทั่วไป)
function clinicLook(c) {
  c = String(c || '');
  if (/นอกเวลา/.test(c)) return { e: '🌙', bg: 'var(--sky)', sub: 'หลังเวลาราชการ', after: true };
  if (/tele/i.test(c)) return { e: '💻', bg: '#efeaff', sub: 'ตรวจทางไกล' };
  if (/premium|kids/i.test(c)) return { e: '👑', bg: '#fff6df', sub: 'คลินิกพิเศษ' };
  return { e: '🩺', bg: 'var(--blush)', sub: 'ในเวลาราชการ' };

function drawChip() {
  const chip = document.getElementById('clinicChip');

  chip.hidden = false;
  chip.className = 'clinic-chip' + (clinicLook(S.clinic).after ? ' after' : '');
  chip.replaceChildren(S.clinic ? clinicLook(S.clinic).e + ' ' : h('span', { class: 'dot' }), S.clinic ? S.clinic.replace('คลินิก', '') : 'เลือกคลินิก', ' ▾');

function pickClinic(then) {
  return new Promise(resolve => {

      h('h2', { style: 'margin-top:0' }, 'วันนี้เบิกให้คลินิกไหน?'),

      S.clinics.map(c => {
        const k = clinicLook(c);
        return h('button', { class: 'opt' + (c === S.clinic ? ' on' : ''), onclick: () => {

async function needClinic() {

}

// ---------- เริ่มต้น ----------
async function main() {
  try {
    await liff.init({ liffId: CONFIG.LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    S.idToken = liff.getIDToken();
    try { S.sub = (liff.getDecodedIDToken() || {}).sub || ''; } catch (_) {}
    const fresh = api('init');
    // เปิดเร็ว: ใช้ข้อมูลครั้งก่อนแสดงทันที แล้วค่อยอัปเดตตัวเลขล่าสุดตามมา
    let cached = null;
    try { const c = JSON.parse(load(KEY_BASE) || 'null'); if (c && S.sub && c.sub === S.sub && c.d && c.d.me) cached = c.d; } catch (_) {}
    if (cached) {
      startApp(cached);
      fresh.then(d => {
        if (!d.me) { store(KEY_BASE, null); return showRegister(d); }
        applyBase(d);
        if (S.view === 'home' && S.redraw) S.redraw();
      }).catch(() => {});
      return;
    }
    const d = await fresh;
    if (!d.me) return showRegister(d);
    startApp(d);
  } catch (e) {
    render(h('div', { class: 'card', style: 'text-align:center' },
      h('div', { style: 'font-size:42px' }, '😿'),
      h('h2', {}, 'เปิดระบบไม่สำเร็จ'),
      h('p', { class: 'muted' }, e.message),
      h('p', { class: 'sm muted' }, 'ลองปิดหน้านี้แล้วเปิดใหม่จากเมนูใน LINE')));
  }
}

function startApp(d) {
  applyBase(d); restoreClinic(); drawChip();
  const c = codeFromUrl();
  if (c) showItem(c);
  else if (viewFromUrl() === 'summary' && isKeeper()) return showSummary();
  else showHome();
  if (!S.clinic && S.clinics.length) pickClinic();
}

async function scan() {
  try {

    const code = await scanCode();

  } catch (e) { toast(e.message, true); }

// เปิดกล้อง LINE แล้วคืนรหัสพัสดุจากป้าย QR
async function scanCode() {
  if (!liff.scanCodeV2) throw new Error('เปิดระบบจากเมนูใน LINE เพื่อใช้กล้องสแกน');
  const r = await liff.scanCodeV2();
  if (!r || !r.value) return '';
  let code = r.value;
  try { code = new URL(r.value).searchParams.get('item') || r.value; } catch (_) {}
  return code.trim();
}

function cart() {
  if (!S.cart) { try { S.cart = JSON.parse(load(KEY_CART) || '[]'); } catch (_) { S.cart = []; } }
  S.cart = S.cart.filter(l => S.items.length === 0 || S.items.some(i => i.code === l.code));
  return S.cart;
}
function saveCart() { store(KEY_CART, JSON.stringify(S.cart || [])); drawCartBar(); }
function drawCartBar() {
  let bar = document.getElementById('cartbar');
  const n = S.me ? cart().length : 0;
  const show = n > 0 && S.view !== 'cart';
  document.body.classList.toggle('has-cart', show);
  if (!show) { if (bar) bar.remove(); return; }
  if (!bar) { bar = h('button', { id: 'cartbar', onclick: () => showCart() }); document.body.append(bar); }
  bar.replaceChildren(h('span', {}, '🧺'), h('b', {}, 'ตะกร้า'), h('span', { class: 'n' }, n), h('span', { style: 'margin-left:auto' }, 'ตรวจแล้วกดยืนยัน ›'));
}
function addToCart(i, qty) {
  if (!(qty > 0)) throw new Error('กรุณาใส่จำนวนให้ถูกต้อง');

  const line = c.find(l => l.code === i.code);

    h('div', { class: 'big-ok', html: ICON_OK }),
    h('h2', { style: 'margin:0' }, 'ใส่ตะกร้าแล้ว 🧺'),
    h('p', { class: 'muted', style: 'margin:6px 0 0' }, i.name + ' · ' + fmtN(qty) + ' ' + i.unit + (line ? ' (รวม ' + fmtN(line.qty) + ')' : '')),
    h('p', { class: 'sm', style: 'margin:4px 0 0;color:var(--pink-d)' }, 'ในตะกร้ามี ' + c.length + ' รายการ · ยังไม่ได้เบิกจนกว่าจะกดยืนยัน'),
    h('div', { class: 'stack' },
      h('button', { class: 'btn btn-main', onclick: () => { ov.remove(); scan(); } }, '📷 สแกนชิ้นต่อไป'),
      h('button', { class: 'btn btn-pink', onclick: () => { ov.remove(); showCart(); } }, '🧺 ดูตะกร้า / ยืนยันเบิก'))));
}
function showCart() {
  const c = cart();
  const note = h('input', { class: 'field', type: 'text', placeholder: 'หมายเหตุ (ถ้ามี)' });
  const list = h('div', { class: 'list' });

    list.replaceChildren(...c.map(l => {

      const inp = h('input', { type: 'number', inputmode: 'decimal', min: '0', step: 'any', value: String(l.qty) });
      inp.addEventListener('change', () => { const v = Number(inp.value); if (v > 0) { l.qty = v; saveCart(); } else inp.value = l.qty; });
      const bump = d => { l.qty = Math.max(1, (Number(l.qty) || 1) + d); inp.value = l.qty; saveCart(); };
      const asReq = i.type === 'ต้องขอ' && !isKeeper();

        h('div', { style: 'min-width:0;flex:1' }, h('div', { class: 'nm' }, i.name),
          h('div', { class: 'sm muted' }, i.unit + (asReq ? ' · 🔒 ส่งเป็นคำขอ' : i.type === 'กู้ชีพ' ? ' · 🚑 ใช้จากรถฉุกเฉิน' : ''))),

      h('div', { class: 'big-ok', html: ICON_OK }),

      h('p', { class: 'muted', style: 'margin:6px 0 0' }, [d.done ? 'เบิก ' + d.done + ' รายการ' : '', d.requested ? 'ส่งคำขอ ' + d.requested + ' รายการ' : ''].filter(Boolean).join(' · ') || names + ' รายการ'),
      S.clinic ? h('p', { class: 'sm', style: 'margin:4px 0 0;color:var(--pink-d)' }, S.clinic) : null,
      h('div', { class: 'stack' },
        h('button', { class: 'btn btn-main', onclick: () => { ov.remove(); scan(); } }, '📷 เริ่มสแกนรอบใหม่'),
        h('button', { class: 'btn btn-soft', onclick: () => { ov.remove(); showHome(); } }, 'กลับหน้าแรก'))));
    ov.dataset.lock = '1';

  render(back(),
    h('h2', {}, '🧺 ตะกร้าของฉัน'),
    h('p', { class: 'sm muted' }, 'ตรวจว่าหยิบครบ จำนวนถูกต้อง กด ✕ เพื่อลบรายการที่สแกนผิด แล้วกดยืนยัน'),
    S.clinics.length ? h('button', { class: 'opt', onclick: () => pickClinic(() => showCart()) },
      h('div', { class: 'oi', style: 'background:' + clinicLook(S.clinic).bg }, clinicLook(S.clinic).e),
      h('div', {}, h('span', { class: 'sm muted' }, 'เบิกให้คลินิก (แตะเพื่อเปลี่ยน)'), h('b', {}, S.clinic || 'ยังไม่ได้เลือก'))) : null,
    list,
    h('button', { class: 'btn btn-soft', style: 'margin-top:12px', onclick: scan }, '📷 สแกนเพิ่ม'),

          (x.clinic ? ' · ' + x.clinic.replace('คลินิก', '') : '') + (x.unitName ? ' · ' + x.unitName : '')),
        st ? h('span', { class: 'tag', style: 'margin-top:4px;display:inline-block;background:' + st[1] + ';color:' + st[2] }, st[0] + (x.by ? ' · ' + x.by : '')) : null),
      h('div', { class: 'r' }, h('b', { style: 'color:' + (x.qty < 0 ? 'var(--ink)' : 'var(--ok)') }, (x.qty > 0 ? '+' : '') + fmtN(x.qty)), h('span', { class: 'sm muted' }, x.unit))));
  });
  render(back(), h('h2', {}, '🧾 ประวัติของฉัน'),
    h('p', { class: 'sm muted' }, 'รายการที่คุณทำย้อนหลัง 90 วัน (− คือของออก, + คือของเข้า)'),
    out.length ? out : h('p', { class: 'muted', style: 'text-align:center' }, 'ยังไม่มีประวัติ'));
}

// ---------- สรุปรายเดือน ----------
// p = { month: 'yyyy-MM' } หรือ { from: 'yyyy-MM-dd', to: 'yyyy-MM-dd' } (ไม่ส่ง = เดือนนี้)
async function showSummary(p, tab) {
  if (typeof p === 'string') p = { month: p };
  p = p || {};
  loading('กำลังสรุปข้อมูล...');
  let d;
  try { d = await api('summary', { month: p.month || '', from: p.from || '', to: p.to || '' }); } catch (e) { toast(e.message, true); return showHome(); }
  S.sumTab = tab || S.sumTab || 'use';
  const shortC = c => c.replace('คลินิก', '');
  const isMonth = d.mode === 'month';
  // ตัวเลือกช่วงเวลา
  const ymd = x => x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0');
  const now = new Date(), todayS = ymd(now);
  const fyStart = new Date(now.getMonth() >= 9 ? now.getFullYear() : now.getFullYear() - 1, 9, 1);
  const presets = [
    ['r3', '3 เดือนล่าสุด', { from: ymd(new Date(now.getFullYear(), now.getMonth() - 2, 1)), to: todayS }],
    ['r6', '6 เดือนล่าสุด', { from: ymd(new Date(now.getFullYear(), now.getMonth() - 5, 1)), to: todayS }],
    ['fy', 'ปีงบประมาณ ' + (fyStart.getFullYear() + 544), { from: ymd(fyStart), to: todayS }]
  ];
  const cur = isMonth ? 'm:' + d.month : (presets.find(x => x[2].from === d.from && x[2].to === d.to) || ['custom'])[0];
  const months = d.months.length ? d.months : [{ key: d.month, label: d.label }];
  const monthSel = h('select', { class: 'field' },
    h('optgroup', { label: 'รายเดือน' }, months.map(m => h('option', { value: 'm:' + m.key, selected: cur === 'm:' + m.key }, m.label))),
    h('optgroup', { label: 'ช่วงเวลา' }, presets.map(x => h('option', { value: x[0], selected: cur === x[0] }, x[1])),
      h('option', { value: 'custom', selected: cur === 'custom' }, 'เลือกช่วงวันที่เอง…')));
  const fromIn = h('input', { class: 'field', type: 'date', value: d.from, style: 'min-width:0;padding-left:10px;padding-right:6px' }), toIn = h('input', { class: 'field', type: 'date', value: d.to, max: todayS, style: 'min-width:0;padding-left:10px;padding-right:6px' });
  const custom = h('div', { class: 'card', style: 'padding:12px 14px;margin:8px 0 0' + (cur === 'custom' ? '' : ';display:none') },
    h('div', { style: 'display:grid;grid-template-columns:1fr 1fr;gap:8px' },
      h('div', { style: 'min-width:0' }, h('label', { class: 'lb', style: 'margin-top:0' }, 'ตั้งแต่'), fromIn),
      h('div', { style: 'min-width:0' }, h('label', { class: 'lb', style: 'margin-top:0' }, 'ถึง'), toIn)),
    h('div', { class: 'stack', style: 'margin-top:10px' }, h('button', { class: 'btn btn-main', onclick: () => {
      if (!fromIn.value || !toIn.value) return toast('เลือกวันที่ให้ครบ', true);
      showSummary({ from: fromIn.value, to: toIn.value });
    } }, 'ดูสรุปช่วงนี้')));
  monthSel.addEventListener('change', () => {
    const v = monthSel.value;
    if (v === 'custom') { custom.style.display = ''; return; }
    if (v.startsWith('m:')) return showSummary({ month: v.slice(2) });
    showSummary(presets.find(x => x[0] === v)[2]);
  });
  const P = isMonth ? { month: d.month } : { from: d.from, to: d.to };
  const prevWord = isMonth ? 'เดือนก่อน' : 'ช่วงก่อน';
  const body = h('div', { class: 'list' });
  const empty = t => h('p', { class: 'muted', style: 'text-align:center' }, t);
  const tabs = [['use', '📦 ยอดใช้'], ['restock', '🛒 ควรเบิก'], ['people', '🙋 ใครเบิก'], ['count', '📋 ผลนับ']];
  const chips = h('div', { class: 'chips' });
  const draw = () => {
    chips.replaceChildren(...tabs.map(([k, t]) => h('button', { class: 'chip' + (S.sumTab === k ? ' on' : ''), style: 'padding:7px 11px', onclick: () => { S.sumTab = k; draw(); } }, t)));
    let rows = [];
    if (S.sumTab === 'use') {
      rows = d.usage.map(u => {
        const by = d.clinics.filter(c => u.clinics[c]).map(c => shortC(c) + ' ' + fmtN(u.clinics[c]));
        if (u.clinics['ไม่ระบุคลินิก']) by.push('ไม่ระบุ ' + fmtN(u.clinics['ไม่ระบุคลินิก']));
        const diff = u.qty - u.prev;
        return h('div', { class: 'srow' },
          h('div', { style: 'min-width:0' }, h('div', { class: 'nm' }, u.name), h('div', { class: 'sm muted' }, by.join(' · ') || '-')),
          h('div', { class: 'r' }, h('b', {}, fmtN(u.qty) + ' ' + u.unit),
            h('span', { class: 'sm ' + (diff > 0 ? 'up' : diff < 0 ? 'down' : 'muted') },
              prevWord + ' ' + fmtN(u.prev) + (diff > 0 ? ' ▲' : diff < 0 ? ' ▼' : ''))));
      });
      if (!rows.length) rows = [empty(isMonth ? 'ยังไม่มีการเบิกในเดือนนี้' : 'ไม่มีการเบิกในช่วงนี้')];
    }
    if (S.sumTab === 'restock') {
      const need = d.restock.filter(r => r.suggest > 0), zero = d.restock.filter(r => r.suggest <= 0);
      rows = [h('p', { class: 'sm muted', style: 'margin:0' }, 'คิดจากยอดใช้เฉลี่ย ' + Math.max(1, d.avgMonths) + ' เดือน + สำรอง ' + Math.round(d.buffer * 100) + '% เทียบกับคงเหลือตอนนี้')]
        .concat(need.map(r => h('div', { class: 'srow' },
          h('div', { style: 'min-width:0' }, h('div', { class: 'nm' }, r.name),
            h('div', { class: 'sm muted' }, 'เหลือ ' + (r.qty == null ? '–' : fmtN(r.qty)) + ' · ใช้เฉลี่ย ' + fmtN(r.avg) + '/เดือน')),
          h('div', { class: 'r' }, h('b', { style: 'color:var(--pink-d)' }, 'เบิก ' + fmtN(r.suggest)), h('span', { class: 'sm muted' }, r.unit)))));
      if (!need.length) rows.push(empty('ยังไม่มีรายการที่ต้องเบิกเพิ่ม 🎉'));
      if (zero.length) rows.push(h('details', { class: 'card', style: 'margin:6px 0 0' },
        h('summary', { class: 'sm' }, 'คงเหลือ 0 แต่ยังไม่มียอดใช้ (' + zero.length + ' รายการ)'),
        h('p', { class: 'sm muted', style: 'margin-bottom:0' }, zero.map(r => r.name).join(', '))));
    }
    if (S.sumTab === 'people') {
      rows = d.people.map(p => h('div', { class: 'card', style: 'padding:14px 16px;margin:0' },
        h('div', { style: 'display:flex;justify-content:space-between' }, h('b', {}, p.name), h('span', { class: 'sm muted' }, p.times + ' ครั้ง')),
        h('div', { class: 'sm muted', style: 'margin-top:4px' }, p.items.map(i => i.name + ' ' + fmtN(i.qty) + ' ' + i.unit).join(' · '))));
      if (!rows.length) rows = [empty(isMonth ? 'ยังไม่มีการเบิกในเดือนนี้' : 'ไม่มีการเบิกในช่วงนี้')];
    }
    if (S.sumTab === 'count') {
      rows = [h('p', { class: 'sm muted', style: 'margin:0' }, 'นับแล้ว ' + d.counts.n + ' รายการ' +
        (d.counts.lossValue ? ' · ของขาดมูลค่าประมาณ ' + fmtN(Math.abs(d.counts.lossValue)) + ' บาท' : ''))]
        .concat(d.counts.diffs.map(c => h('div', { class: 'srow' },
          h('div', { style: 'min-width:0' }, h('div', { class: 'nm' }, c.name),
            h('div', { class: 'sm muted' }, 'ระบบ ' + fmtN(c.sys) + ' · นับได้ ' + fmtN(c.counted) + ' · ' + c.by)),
          h('div', { class: 'r' }, h('b', { class: c.diff < 0 ? 'up' : 'down' }, (c.diff > 0 ? '+' : '') + fmtN(c.diff)), h('span', { class: 'sm muted' }, c.unit)))));
      if (!d.counts.diffs.length) rows.push(empty(d.counts.n ? 'นับตรงกับระบบทุกรายการ 👍' : (isMonth ? 'ยังไม่ได้นับในเดือนนี้' : 'ไม่มีการนับในช่วงนี้')));
    }
    body.replaceChildren(...rows);
  };
  render(back(),
    h('h2', { style: 'margin-bottom:6px' }, '📊 สรุปพัสดุ'),
    monthSel, custom,
    isMonth ? null : h('p', { class: 'sm', style: 'margin:8px 2px 0;color:var(--pink-d)' }, '📅 ' + d.label),
    h('div', { class: 'stats' },
      h('div', { class: 'stat' }, h('b', {}, fmtN(d.totals.times)), h('span', {}, 'ครั้งที่เบิก')),
      h('div', { class: 'stat' }, h('b', {}, fmtN(d.totals.items)), h('span', {}, 'รายการ')),
      h('div', { class: 'stat' }, h('b', {}, fmtN(d.totals.value)), h('span', {}, 'มูลค่า (บาท)'))),
    chips, body,
    h('div', { class: 'stack', style: 'margin-top:16px' }, act('🖨️ ทำรายงานสำหรับพิมพ์', 'btn-main', async () => {
      const r = await api('summarySheet', { month: P.month || '', from: P.from || '', to: P.to || '' });
      const open = url => { try { liff.openWindow({ url, external: true }); } catch (_) { window.open(url, '_blank'); } };
      sheet(h('h2', { style: 'margin-top:0' }, '🖨️ รายงานพร้อมแล้ว'),
        h('p', { class: 'sm muted' }, 'สร้างแท็บ "' + r.sheet + '" ใน Google Sheet แล้ว เปิดได้เฉพาะบัญชี Google ที่มีสิทธิ์เข้าไฟล์ระบบสต๊อก'),
        h('div', { class: 'stack' },
          h('button', { class: 'btn btn-main', onclick: () => open(r.pdf) }, '📄 เปิดเป็น PDF (A4)'),
          h('button', { class: 'btn btn-soft', onclick: () => open(r.url) }, '📊 เปิดแท็บใน Google Sheet')),
        h('p', { class: 'sm muted', style: 'margin-bottom:0' }, 'ส่วนใหญ่สะดวกที่สุดคือเปิดบนคอม แล้วสั่งพิมพ์จาก PDF'));
    })));
  draw();
}

main();
</script>
</body>
</html>
