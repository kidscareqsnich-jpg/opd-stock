<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#cfe3ff">
<title>พัสดุ OPD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root {
    --sky:#e8f2ff; --sky2:#cfe3ff; --blue:#6ea8f0; --blue-d:#3f7fd6;
    --blush:#ffeef4; --pink:#ffc7da; --pink-d:#e8799f;
    --ink:#3b4660; --muted:#8a94ad; --line:#e6ebf5; --card:#ffffff;
    --ok:#3dbb8a; --ok-bg:#e3f7ee; --bad:#e2637d; --bad-bg:#ffe8ed;
    --open:#e3f7ee; --open-t:#2b9a70; --ask:#fff1df; --ask-t:#c27a22; --life:#ffe3ea; --life-t:#d0496b;
    --r:20px; --shadow:0 6px 20px rgba(110,140,200,.14);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; }
  body {
    font:16px/1.5 "Prompt", system-ui, sans-serif; color:var(--ink);
    background:linear-gradient(180deg, var(--sky) 0%, #f6f9ff 40%, var(--blush) 100%) fixed;
    min-height:100vh;
  }
  .brand { font-family:"Mali", "Prompt", sans-serif; }
  button, input, select { font:inherit; color:inherit; }

  /* ---------- top bar ---------- */
  header {
    position:sticky; top:0; z-index:5; padding:14px 16px 12px;
    background:linear-gradient(120deg, rgba(207,227,255,.92), rgba(255,215,229,.92));
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(255,255,255,.7);
  }
  .top { max-width:560px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .hello { font-size:13px; color:var(--muted); line-height:1.2; }
  .hello b { display:block; font-family:"Mali", sans-serif; font-size:19px; color:var(--ink); }
  .clinic-chip {
    border:none; background:#fff; border-radius:999px; padding:8px 12px 8px 10px;
    display:flex; align-items:center; gap:6px; font-size:13px; font-weight:500; box-shadow:var(--shadow);
    max-width:56%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .clinic-chip .dot { width:10px; height:10px; border-radius:50%; background:var(--pink-d); flex:none; }
  .clinic-chip.after .dot { background:var(--blue-d); }

  main { max-width:560px; margin:0 auto; padding:16px 16px 96px; }
  h2 { font-family:"Mali", sans-serif; font-size:22px; margin:6px 0 10px; }
  h3 { font-family:"Mali", sans-serif; font-size:17px; margin:20px 0 8px; }
  .muted { color:var(--muted); } .sm { font-size:13px; }
  .card { background:var(--card); border-radius:var(--r); padding:18px; box-shadow:var(--shadow); margin-bottom:14px; }

  /* ---------- home ---------- */
  .scan-hero {
    width:100%; border:none; border-radius:26px; padding:22px 20px; text-align:left; cursor:pointer;
    background:linear-gradient(135deg, #8ebcf7 0%, #b9a8f2 55%, #f7a8c6 100%); color:#fff;
    box-shadow:0 12px 28px rgba(140,140,230,.35); display:flex; align-items:center; gap:16px;
  }
  .scan-hero .ico { width:60px; height:60px; border-radius:18px; background:rgba(255,255,255,.25); display:grid; place-items:center; flex:none; }
  .scan-hero b { font-family:"Mali", sans-serif; font-size:22px; display:block; }
  .scan-hero span { font-size:13px; opacity:.92; }
  .tiles { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin:14px 0 18px; }
  .tile {
    border:none; background:#fff; border-radius:18px; padding:14px 6px 12px; box-shadow:var(--shadow);
    display:flex; flex-direction:column; align-items:center; gap:6px; font-size:13px; font-weight:500; position:relative;
  }
  .tile .ti { width:42px; height:42px; border-radius:14px; display:grid; place-items:center; font-size:22px; }
  .tile .badge-n { position:absolute; top:8px; right:10px; background:var(--pink-d); color:#fff; border-radius:999px; font-size:11px; min-width:20px; padding:1px 6px; }
  .search { position:relative; }
  .search input { width:100%; border:none; background:#fff; border-radius:16px; padding:13px 14px 13px 42px; box-shadow:var(--shadow); outline:none; }
  .search svg { position:absolute; left:14px; top:50%; transform:translateY(-50%); }
  .chips { display:flex; gap:8px; overflow-x:auto; padding:12px 2px 6px; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { border:none; white-space:nowrap; border-radius:999px; padding:7px 14px; font-size:13px; background:rgba(255,255,255,.7); color:var(--muted); }
  .chip.on { background:var(--blue); color:#fff; }
  .list { display:grid; gap:10px; margin-top:6px; }
  .item {
    width:100%; border:none; background:#fff; border-radius:18px; padding:12px 14px; text-align:left;
    display:flex; align-items:center; gap:12px; box-shadow:0 3px 12px rgba(110,140,200,.10);
  }
  .item .em { width:40px; height:40px; border-radius:13px; display:grid; place-items:center; font-size:20px; flex:none; }
  .item .nm { font-weight:500; font-size:15px; line-height:1.3; }
  .item .meta { font-size:12px; color:var(--muted); }
  .item .q { margin-left:auto; text-align:right; flex:none; }
  .item .q b { display:block; font-size:16px; }
  .tag { display:inline-block; font-size:11px; padding:2px 9px; border-radius:999px; font-weight:500; }
  .t-open { background:var(--open); color:var(--open-t); }
  .t-ask { background:var(--ask); color:var(--ask-t); }
  .t-life { background:var(--life); color:var(--life-t); }

  /* ---------- item page ---------- */
  .back { border:none; background:rgba(255,255,255,.75); border-radius:999px; padding:8px 14px; font-size:14px; margin-bottom:12px; }
  .hero-item { text-align:center; padding:24px 18px; }
  .hero-item .em-big { width:76px; height:76px; margin:0 auto 10px; border-radius:24px; display:grid; place-items:center; font-size:38px; }
  .hero-item .code { font-size:12px; color:var(--muted); }
  .stock { margin:14px auto 4px; display:inline-flex; align-items:baseline; gap:6px; background:var(--sky); border-radius:16px; padding:8px 18px; }
  .stock b { font-size:28px; font-family:"Mali", sans-serif; color:var(--blue-d); }
  .stepper { display:flex; align-items:center; justify-content:center; gap:14px; margin:18px 0 6px; }
  .stepper button { width:56px; height:56px; border-radius:50%; border:none; font-size:28px; background:var(--sky); color:var(--blue-d); }
  .stepper button.plus { background:var(--blush); color:var(--pink-d); }
  .stepper input { width:96px; text-align:center; font-size:30px; font-family:"Mali", sans-serif; border:none; background:transparent; outline:none; }
  .unit { text-align:center; color:var(--muted); font-size:13px; }
  .field { width:100%; border:1.5px solid var(--line); background:#fff; border-radius:14px; padding:12px 14px; margin:8px 0; outline:none; }
  .field:focus { border-color:var(--blue); }
  label.lb { display:block; font-size:13px; color:var(--muted); margin-top:10px; }
  .btn { width:100%; border:none; border-radius:16px; padding:15px; font-size:16px; font-weight:600; cursor:pointer; }
  .btn:disabled { opacity:.55; }
  .btn-main { background:linear-gradient(120deg, var(--blue) 0%, #a59cf0 60%, var(--pink-d) 100%); color:#fff; box-shadow:0 8px 20px rgba(130,130,230,.3); }
  .btn-soft { background:var(--sky); color:var(--blue-d); }
  .btn-pink { background:var(--blush); color:var(--pink-d); }
  .btn-ok { background:var(--ok); color:#fff; }
  .btn-line { background:#fff; color:var(--bad); border:1.5px solid var(--bad-bg); }
  .stack { display:grid; gap:10px; margin-top:16px; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .note { background:var(--ask); color:var(--ask-t); border-radius:14px; padding:10px 12px; font-size:13px; margin-top:12px; }
  .note.life { background:var(--life); color:var(--life-t); }
  .check { display:flex; align-items:center; gap:10px; margin:12px 0; font-size:15px; }
  .check input { width:20px; height:20px; accent-color:var(--pink-d); }

  /* ---------- sheet / modal ---------- */
  .overlay { position:fixed; inset:0; background:rgba(60,70,100,.35); z-index:20; display:flex; align-items:flex-end; justify-content:center; animation:fade .2s; }
  .sheet { width:100%; max-width:560px; background:#fff; border-radius:28px 28px 0 0; padding:22px 18px calc(22px + env(safe-area-inset-bottom)); animation:up .25s ease-out; }
  .sheet .grab { width:44px; height:5px; border-radius:99px; background:var(--line); margin:-8px auto 14px; }
  .opt { width:100%; border:2px solid var(--line); background:#fff; border-radius:18px; padding:16px; display:flex; align-items:center; gap:14px; text-align:left; margin-bottom:10px; }
  .opt.on { border-color:var(--pink-d); background:var(--blush); }
  .opt .oi { width:46px; height:46px; border-radius:15px; display:grid; place-items:center; font-size:24px; flex:none; }
  .opt b { display:block; font-size:16px; }
  .success { text-align:center; }
  .success .big-ok { width:84px; height:84px; border-radius:50%; margin:4px auto 12px; background:var(--ok-bg); display:grid; place-items:center; animation:pop .35s ease-out; }
  @keyframes fade { from { opacity:0; } }
  @keyframes up { from { transform:translateY(40px); opacity:.4; } }
  @keyframes pop { 0% { transform:scale(.5); } 70% { transform:scale(1.1); } }

  /* ---------- count ---------- */
  .crow { background:#fff; border-radius:16px; padding:10px 12px; display:grid; grid-template-columns:1fr 84px 64px; gap:8px; align-items:center; box-shadow:0 3px 12px rgba(110,140,200,.10); }
  .crow.done { background:var(--ok-bg); }
  .crow input { width:100%; border:1.5px solid var(--line); border-radius:12px; padding:9px; text-align:center; outline:none; }
  .crow .btn { padding:10px 0; font-size:14px; border-radius:12px; }
  .progress { height:10px; background:var(--sky); border-radius:99px; overflow:hidden; margin:8px 0 4px; }
  .progress i { display:block; height:100%; background:linear-gradient(90deg, var(--blue), var(--pink-d)); border-radius:99px; transition:width .3s; }

  /* ---------- toast ---------- */
  #toast { position:fixed; left:16px; right:16px; top:calc(12px + env(safe-area-inset-top)); z-index:30; margin:0 auto; max-width:520px;
    background:var(--ink); color:#fff; padding:13px 16px; border-radius:16px; text-align:center; font-size:14px;
    box-shadow:0 10px 24px rgba(40,50,80,.25); opacity:0; transform:translateY(-16px); transition:.2s; pointer-events:none; }
  #toast.show { opacity:1; transform:none; } #toast.bad { background:var(--bad); }
  .loading { text-align:center; padding:60px 0; color:var(--muted); }
  .loading .blob { width:54px; height:54px; margin:0 auto 12px; border-radius:50%; background:linear-gradient(135deg, var(--sky2), var(--pink)); animation:pulse 1.2s infinite ease-in-out; }
  @keyframes pulse { 50% { transform:scale(.8); opacity:.6; } }
</style>
</head>
<body>
<header><div class="top">
  <div class="hello" id="hello"><span>พัสดุ OPD</span><b class="brand">สวัสดีค่ะ 🌸</b></div>
  <button class="clinic-chip" id="clinicChip" hidden></button>
</div></header>
<main id="app"><div class="loading"><div class="blob"></div>กำลังเปิดระบบ...</div></main>
<div id="toast"></div>

<script>
const CONFIG = {
  LIFF_ID: '2012074647-BmAlHwZ3',
  API_URL: 'https://script.google.com/macros/s/AKfycbx8jDwnC2srH8r_7BqTh7m4cZM_3WWhI8HZGr-MtkNrV5VHNsVc09mksqlhnok9VpOq/exec'
};

const S = { me: null, items: [], pending: 0, staff: [], units: [], clinics: [], clinic: '', cat: 'ทั้งหมด', idToken: '' };
const $app = document.getElementById('app');
const KEY_CLINIC = 'opd-clinic';
const KEY_PARTNER = 'opd-count-partner';
const KEY_BASE = 'opd-base';

// ---------- ตัวช่วย ----------
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === false || v == null) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  kids.flat().forEach(c => { if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(String(c))); });
  return el;
}
function render(...nodes) { S.view = ''; $app.replaceChildren(...nodes.filter(Boolean)); window.scrollTo(0, 0); }
function loading(msg) { render(h('div', { class: 'loading' }, h('div', { class: 'blob' }), msg || 'กำลังโหลด...')); }
function toast(msg, bad, ms) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'show' + (bad ? ' bad' : '');
  clearTimeout(toast.t); toast.t = setTimeout(() => { t.className = ''; }, ms || 2600);
}
function fmtN(n) { return Number(n).toLocaleString('th-TH', { maximumFractionDigits: 2 }); }
function isKeeper() { return S.me && S.me.keeper; }
function store(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (_) {} }
function load(k) { try { return localStorage.getItem(k); } catch (_) { return null; } }
function today() { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }

const CAT_EMOJI = { 'วัสดุสำนักงาน': '📎', 'วัสดุงานบ้านงานครัว': '🧴', 'วัสดุการแพทย์': '🩺', 'วัสดุคอมพิวเตอร์': '🖨️', 'วัสดุไฟฟ้าและวิทยุ': '🔦', 'วัสดุเวชภัณฑ์ที่มิใช่ยา': '💉' };
const CAT_BG = { 'วัสดุสำนักงาน': '#e8f2ff', 'วัสดุงานบ้านงานครัว': '#e9f8f1', 'วัสดุการแพทย์': '#ffeef4', 'วัสดุคอมพิวเตอร์': '#efeaff', 'วัสดุไฟฟ้าและวิทยุ': '#fff6df', 'วัสดุเวชภัณฑ์ที่มิใช่ยา': '#ffeef4' };
const CAT_SHORT = { 'วัสดุสำนักงาน': 'สำนักงาน', 'วัสดุงานบ้านงานครัว': 'งานบ้าน', 'วัสดุการแพทย์': 'การแพทย์', 'วัสดุคอมพิวเตอร์': 'คอมพิวเตอร์', 'วัสดุไฟฟ้าและวิทยุ': 'ไฟฟ้า', 'วัสดุเวชภัณฑ์ที่มิใช่ยา': 'เวชภัณฑ์' };
function emo(i) { return h('div', { class: 'em', style: 'background:' + (CAT_BG[i.cat] || '#e8f2ff') }, CAT_EMOJI[i.cat] || '📦'); }
function tag(t) { return h('span', { class: 'tag ' + (t === 'ต้องขอ' ? 't-ask' : t === 'กู้ชีพ' ? 't-life' : 't-open') }, t === 'ต้องขอ' ? '🔒 ต้องขอ' : t === 'กู้ชีพ' ? '🚑 กู้ชีพ' : 'หยิบได้เลย'); }
const ICON_SCAN = '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M7 12h10"/></svg>';
const ICON_SEARCH = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8a94ad" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>';
const ICON_OK = '<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#3dbb8a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';

function back(fn, label) { return h('button', { class: 'back', onclick: fn || showHome }, '‹ ' + (label || 'กลับ')); }
function act(label, cls, fn) {
  const b = h('button', { class: 'btn ' + (cls || 'btn-main') }, label);
  b.addEventListener('click', async () => {
    b.disabled = true;
    try { await fn(); } catch (e) { toast(e.message, true); } finally { b.disabled = false; }
  });
  return b;
}
function stepper(start) {
  const input = h('input', { type: 'number', inputmode: 'decimal', min: '0', step: 'any', value: String(start == null ? 1 : start) });
  const minus = h('button', { type: 'button', onclick: () => { input.value = Math.max(1, (Number(input.value) || 1) - 1); } }, '−');
  const plus = h('button', { type: 'button', class: 'plus', onclick: () => { input.value = (Number(input.value) || 0) + 1; } }, '+');
  return { el: h('div', { class: 'stepper' }, minus, input, plus), input };
}
function unitInput(ph) {
  const id = 'u' + Math.random().toString(36).slice(2);
  const input = h('input', { class: 'field', type: 'text', list: id, placeholder: ph });
  return { el: h('div', {}, input, h('datalist', { id }, S.units.map(u => h('option', { value: u })))), input };
}
function sheet(...kids) {
  const ov = h('div', { class: 'overlay' });
  const sh = h('div', { class: 'sheet' }, h('div', { class: 'grab' }), ...kids);
  ov.append(sh);
  ov.addEventListener('click', e => { if (e.target === ov && ov.dataset.lock !== '1') ov.remove(); });
  document.body.append(ov);
  return ov;
}

// ---------- หลังบ้าน ----------
async function api(action, data) {
  const res = await fetch(CONFIG.API_URL, { method: 'POST', keepalive: true, body: JSON.stringify(Object.assign({ action, idToken: S.idToken }, data || {})) });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error);
  return j.data;
}
function applyBase(d) {
  if (!d || !Array.isArray(d.items)) return;
  S.me = d.me; S.items = d.items; S.pending = d.pending; S.staff = d.staffNames; S.units = d.units || []; S.clinics = d.clinics || [];
  if (S.me && S.sub) store(KEY_BASE, JSON.stringify({ sub: S.sub, d }));
  if (S.me) {
    const first = S.me.name.split(' ')[0];
    document.getElementById('hello').replaceChildren(h('span', {}, 'พัสดุ OPD · ' + S.me.role), h('b', { class: 'brand' }, 'สวัสดี ' + first + ' 🌸'));
  }
  drawChip();
}
function codeFromUrl() { return new URLSearchParams(location.search).get('item'); }

// ---------- คลินิก (เลือกครั้งเดียวต่อวัน) ----------
function restoreClinic() {
  try {
    const v = JSON.parse(load(KEY_CLINIC) || 'null');
    if (v && v.day === today() && S.clinics.indexOf(v.name) >= 0) S.clinic = v.name;
  } catch (_) {}
}
function drawChip() {
  const chip = document.getElementById('clinicChip');
  if (!S.me || !S.clinics.length) { chip.hidden = true; return; }
  chip.hidden = false;
  chip.className = 'clinic-chip' + (/นอกเวลา/.test(S.clinic) ? ' after' : '');
  chip.replaceChildren(h('span', { class: 'dot' }), S.clinic ? S.clinic.replace('คลินิก', '') : 'เลือกคลินิก', ' ▾');
  chip.onclick = () => pickClinic();
}
function pickClinic(then) {
  return new Promise(resolve => {
    const ov = sheet(
      h('h2', { style: 'margin-top:0' }, 'วันนี้เบิกให้คลินิกไหน?'),
      h('p', { class: 'muted sm', style: 'margin-top:-4px' }, 'เลือกครั้งเดียว ระบบจะจำไว้ทั้งวัน กดเปลี่ยนได้ที่มุมขวาบน'),
      S.clinics.map(c => {
        const after = /นอกเวลา/.test(c);
        return h('button', { class: 'opt' + (c === S.clinic ? ' on' : ''), onclick: () => {
          S.clinic = c; store(KEY_CLINIC, JSON.stringify({ name: c, day: today() })); drawChip(); ov.remove();
          toast('เลือก ' + c + ' แล้ว'); resolve(c); if (then) then(c);
        } },
          h('div', { class: 'oi', style: 'background:' + (after ? 'var(--sky)' : 'var(--blush)') }, after ? '🌙' : '🩺'),
          h('div', {}, h('b', {}, c), h('span', { class: 'sm muted' }, after ? 'หลังเวลาราชการ' : 'ในเวลาราชการ')));
      }));
    if (!S.clinic) ov.dataset.lock = '1';
  });
}
async function needClinic() {
  if (!S.clinics.length || S.clinic) return S.clinic;
  return pickClinic();
}

// ---------- เริ่มต้น ----------
async function main() {
  try {
    await liff.init({ liffId: CONFIG.LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    S.idToken = liff.getIDToken();
    try { S.sub = (liff.getDecodedIDToken() || {}).sub || ''; } catch (_) {}
    const fresh = api('init');
    // เปิดเร็ว: ใช้ข้อมูลครั้งก่อนแสดงทันที แล้วค่อยอัปเดตตัวเลขล่าสุดตามมา
    let cached = null;
    try { const c = JSON.parse(load(KEY_BASE) || 'null'); if (c && S.sub && c.sub === S.sub && c.d && c.d.me) cached = c.d; } catch (_) {}
    if (cached) {
      startApp(cached);
      fresh.then(d => {
        if (!d.me) { store(KEY_BASE, null); return showRegister(d); }
        applyBase(d);
        if (S.view === 'home' && S.redraw) S.redraw();
      }).catch(() => {});
      return;
    }
    const d = await fresh;
    if (!d.me) return showRegister(d);
    startApp(d);
  } catch (e) {
    render(h('div', { class: 'card', style: 'text-align:center' },
      h('div', { style: 'font-size:42px' }, '😿'),
      h('h2', {}, 'เปิดระบบไม่สำเร็จ'),
      h('p', { class: 'muted' }, e.message),
      h('p', { class: 'sm muted' }, 'ลองปิดหน้านี้แล้วเปิดใหม่จากเมนูใน LINE')));
  }
}

async function scan() {
  try {
    if (!(await needClinic()) && S.clinics.length) return;
    if (!liff.scanCodeV2) throw new Error('ใช้กล้องมือถือสแกนป้าย QR ได้เลย');

// ---------- หน้ารายการของ ----------
function showItem(code) {
  const i = S.items.find(x => x.code === code);
  if (!i) { toast('ไม่พบรหัส ' + code, true); return showHome(); }
  const st = stepper(1);
  const note = h('input', { class: 'field', type: 'text', placeholder: 'หมายเหตุ (ถ้ามี)' });
  // แสดงผลทันที แล้วบันทึกเบื้องหลัง ถ้าไม่สำเร็จจะคืนยอดและแจ้งเตือน
  const go = async (action, title) => {
    const clinic = await needClinic();
    if (S.clinics.length && !clinic) return;
    const qty = Number(st.input.value);
    if (!(qty > 0)) throw new Error('กรุณาใส่จำนวนให้ถูกต้อง');
    const before = i.qty;
    if (action === 'withdraw' && i.qty != null) i.qty = i.qty - qty;
    const status = done(i, qty, title);
    try {
      const d = await api(action, { code: i.code, qty, note: note.value, clinic });
      if (d && d.items) applyBase(d);
      else if (d && d.item) { const x = S.items.find(y => y.code === d.item.code); if (x) x.qty = d.item.qty; }
      status.ok();
    } catch (e) {
      i.qty = before;
      status.fail(e.message);
    }
  };
  const acts = h('div', { class: 'stack' });
  if (i.type === 'หยิบได้เลย') acts.append(act('เบิก', 'btn-main', () => go('withdraw', 'เบิกเรียบร้อย')));
  if (i.type === 'กู้ชีพ') acts.append(act('บันทึกใช้จากรถฉุกเฉิน', 'btn-main', () => go('withdraw', 'บันทึกเรียบร้อย')));
  if (i.type === 'ต้องขอ') {
    acts.append(act('ส่งคำขอ', 'btn-main', () => go('request', 'ส่งคำขอแล้ว')));
    if (isKeeper()) acts.append(act(S.me.role === 'หัวหน้า' ? 'จ่ายเอง (ใช้กุญแจสำรอง)' : 'จ่ายเลย', 'btn-pink', () => go('withdraw', 'บันทึกการจ่ายแล้ว')));
  }
  const more = h('div', { class: 'row2' });
  if (i.type === 'หยิบได้เลย' || (i.type === 'ต้องขอ' && isKeeper())) more.append(h('button', { class: 'btn btn-soft', onclick: () => showLoanOut(i) }, '🤝 ให้ยืม'));
  if (isKeeper()) more.append(h('button', { class: 'btn btn-soft', onclick: () => showReceive(i) }, '📦 รับเข้า'));
  if (more.children.length) acts.append(more);

  render(back(),
    h('div', { class: 'card hero-item' },
      h('div', { class: 'em-big', style: 'background:' + (CAT_BG[i.cat] || '#e8f2ff') }, CAT_EMOJI[i.cat] || '📦'),
      h('h2', { style: 'margin:0 0 4px' }, i.name),
      h('div', { class: 'code' }, i.code + ' · ' + (CAT_SHORT[i.cat] || i.cat)),
      h('div', { style: 'margin-top:8px' }, tag(i.type)),
      h('div', { class: 'stock' }, h('span', { class: 'sm muted' }, 'คงเหลือ'), h('b', {}, i.qty == null ? '–' : fmtN(i.qty)), h('span', { class: 'sm muted' }, i.qty == null ? 'ยังไม่นับ' : i.unit))),
    h('div', { class: 'card' },
      st.el, h('div', { class: 'unit' }, 'จำนวน (' + i.unit + ')'),
      note,
      i.type === 'ต้องขอ' && !isKeeper() ? h('div', { class: 'note' }, '🔒 ของชิ้นนี้ผู้ดูแลพัสดุต้องอนุมัติก่อนรับของ') : null,
      i.type === 'กู้ชีพ' ? h('div', { class: 'note life' }, '🚑 ของกู้ชีพหยิบใช้ได้ทันที บันทึกหลังใช้ก็ได้') : null,
      acts));
}
function done(i, qty, title) {
  const line = h('p', { class: 'sm muted', style: 'margin:6px 0 0' }, '⏳ กำลังบันทึกในระบบ...');
  const ov = sheet(h('div', { class: 'success' },

    h('h2', { style: 'margin:0' }, title + ' ✨'),

    line,
    h('div', { class: 'stack' },
      h('button', { class: 'btn btn-main', onclick: () => { ov.remove(); scan(); } }, '📷 สแกนชิ้นต่อไป'),
      h('button', { class: 'btn btn-soft', onclick: () => { ov.remove(); showHome(); } }, 'กลับหน้าแรก'))));
  return {
    ok() { line.textContent = '✓ บันทึกในระบบแล้ว'; line.style.color = '#3dbb8a'; if (S.view === 'home' && S.redraw) S.redraw(); },
    fail(msg) {
      const text = '⚠️ ' + i.name + ' บันทึกไม่สำเร็จ: ' + msg + ' กรุณาลองใหม่';
      if (ov.isConnected) { ov.remove(); showItem(i.code); }
      toast(text, true, 6000);
    }
  };
}

async function showCount() {
  loading();
  let data;
  try { data = await api('countList'); applyBase(data.base); } catch (e) { toast(e.message, true); return showHome(); }
  const counted = data.counted;
  let partner = '';
  try { partner = sessionStorage.getItem(KEY_PARTNER) || ''; } catch (_) {}

  pSel.addEventListener('change', () => { try { sessionStorage.setItem(KEY_PARTNER, pSel.value); } catch (_) {} });
  const q = h('input', { type: 'search', placeholder: 'ค้นหา' });
  const left = h('input', { type: 'checkbox' });
  const bar = h('i'), txt = h('div', { class: 'sm muted' });

  const row = i => {
    const ok = counted[i.code] !== undefined;
    const inp = h('input', { type: 'number', inputmode: 'decimal', min: '0', step: 'any', value: ok ? String(counted[i.code]) : '' });
    return h('div', { class: 'crow' + (ok ? ' done' : '') },
      h('div', { style: 'min-width:0' }, h('div', { style: 'font-size:14px;font-weight:500;line-height:1.3' }, i.name),
        h('div', { class: 'sm muted' }, 'ในระบบ ' + (i.qty == null ? '–' : fmtN(i.qty)) + ' ' + i.unit)),
      inp, act(ok ? 'แก้' : 'บันทึก', ok ? 'btn-soft' : 'btn-main', async () => {
        if (!pSel.value) throw new Error('เลือกผู้นับคนที่ 2 ก่อน');
        const d = await api('count', { code: i.code, counted: inp.value, partner: pSel.value });
        applyBase(d.base); Object.assign(counted, d.counted); toast('บันทึก ' + i.name + ' แล้ว'); draw();
      }));
  };
  const draw = () => {
    const t = q.value.trim().toLowerCase();
    const n = Object.keys(counted).length;
    bar.style.width = Math.round(n / Math.max(1, S.items.length) * 100) + '%';
    txt.textContent = 'นับแล้ว ' + n + ' จาก ' + S.items.length + ' รายการ';
    list.replaceChildren(...S.items.filter(i => (!t || i.name.toLowerCase().includes(t) || i.code.includes(t)) && (!left.checked || counted[i.code] === undefined)).map(row));
  };
  q.addEventListener('input', draw); left.addEventListener('change', draw);
  render(back(),
    h('div', { class: 'card' }, h('h2', { style: 'margin-top:0' }, '📋 นับสต๊อก'),
      h('p', { class: 'sm muted' }, 'กรอกจำนวนที่เห็นจริงบนชั้น รายการที่ยังไม่มียอดตั้งต้น ตัวเลขนี้จะเป็นยอดตั้งต้น รายการที่มีแล้ว ระบบปรับส่วนต่างให้เอง'),
      h('label', { class: 'lb' }, 'นับร่วมกับ'), pSel, h('div', { class: 'progress' }, bar), txt),
    h('div', { class: 'search', html: ICON_SEARCH }, q),
    h('label', { class: 'check' }, left, 'แสดงเฉพาะที่ยังไม่นับ'), list);
  draw();
}

main();
</script>
</body>
</html>
